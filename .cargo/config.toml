# Project-level Cargo configuration.
#
# LLVM prerequisite: NCL's JIT backend (ncl-llvm) links against LLVM 22.1.
# You must set LLVM_SYS_221_PREFIX to your LLVM install before building:
#
#   Windows (PowerShell):
#     $env:LLVM_SYS_221_PREFIX = "C:\path\to\llvm\install"
#     # or permanently:
#     setx LLVM_SYS_221_PREFIX "C:\path\to\llvm\install"
#
#   Linux / macOS:
#     export LLVM_SYS_221_PREFIX=/path/to/llvm/install
#
# Pre-built LLVM 22.1 binaries: https://github.com/llvm/llvm-project/releases
# The trimmed install only needs the headers + LLVM-C.dll / libLLVM.so.

[env]
# Test threads need large stacks: each test loads the full stdlib
# (macroexpansion + LLVM codegen recurse deeply in debug mode).
# 8 MiB matches the ncl-driver worker thread.
RUST_MIN_STACK = "8388608"

# Windows debug builds need a fatter main-thread stack. The default
# 1 MiB is fine for release (optimized frames are tight), but debug
# frames blow it during stdlib bootstrap — every defmacro and defclass
# in conditions.lisp / clos.lisp recurses through unoptimized macro
# expansion. 16 MiB matches what Corman ships and is plenty.
[target.'cfg(target_os = "windows")']
rustflags = ["-C", "link-arg=/STACK:16777216"]
