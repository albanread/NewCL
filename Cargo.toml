[workspace]
members = [
    # Vendored dependencies (formerly external paths / git deps)
    "crates/new-asm",
    "crates/newgc-core",
    "crates/newaudio-core",
    "crates/newaudio-abc",
    "crates/newaudio-win",
    "crates/newaudio",
    # Doc / Mermaid render stack (vendored from NewFactor)
    "crates/doc-crate",
    "crates/docpane",
    "crates/selkie",
    # NCL core crates
    "src/ncl-cl",
    "src/ncl-compiler",
    "src/ncl-driver",
    "src/ncl-ir",
    "src/ncl-llvm",
    "src/ncl-loader",
    "src/ncl-reader",
    "src/ncl-runtime",
    "tests/ncl-corman-demos",
    "tests/ncl-tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.0.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Cross-crate references used by the vendored newaudio family.
[workspace.dependencies]
newaudio-core = { path = "crates/newaudio-core" }
newaudio-abc  = { path = "crates/newaudio-abc" }
newaudio-win  = { path = "crates/newaudio-win" }

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
