[package]
name = "newaudio-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows runtime for NewAudio: waveOut mixer and midiOut scheduler."

[lints]
workspace = true

[dependencies]
newaudio-core = { workspace = true }
newaudio-abc  = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_System_Threading",
] }
